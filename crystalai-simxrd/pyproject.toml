[project]
name = "crystalai-simxrd"
version = "0.1.0"
description = "PXRD simulation (log-d production, 2-theta validation) and on-the-fly augmentation for CrystalAI."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "pymatgen>=2024.1",
    "plotly>=5.15",
    "gradio>=4.0",
    "tqdm",
    "pyyaml",
    "crystalai-data",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crystalai_simxrd"]
